workflows:
  ss_oil_android:
    name: SS OIL Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms android --org com.ssoil .
      - name: Configure permissions and original SS OIL icon
        script: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><application',1)
          s=s.replace('android:label="ss_oil_yeni"','android:label="SS OIL"')
          s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          m.write_text(s)
          for icon in Path('android_icons').glob('mipmap-*/ic_launcher.png'):
              dst=Path('android/app/src/main/res')/icon.parent.name/'ic_launcher.png'
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(icon,dst)
          PYCODE
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
